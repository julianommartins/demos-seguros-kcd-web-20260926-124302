<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Seguros — Seguros KCD</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div class="marca">
        <span class="marca-icone" aria-hidden="true">🛡️</span>
        <div>
          <h1 data-nome-seguradora>Seguros KCD</h1>
          <p class="subtitulo">Catálogo de Seguros</p>
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status-ponto"></span><span class="status-texto">Verificando API…</span>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <section class="barra">
      <label class="busca">
        <span class="sr-only">Buscar seguros</span>
        <input id="busca" type="search" placeholder="Buscar por título ou descrição…" autocomplete="off">
      </label>
      <button class="botao botao-primario" id="novo" type="button">+ Novo seguro</button>
    </section>
    <nav class="categorias" id="categorias" aria-label="Filtrar por categoria"></nav>
    <p class="contador" id="contador"></p>
    <section class="grade" id="grade" aria-live="polite"></section>
  </main>

  <footer class="rodape">
    <p>Desenvolvido para <span data-nome-seguradora>Seguros KCD</span> · plataforma gerenciada pela nullplatform</p>
    <p id="assinatura">Criada com Claude Code, Opus 5.5</p>
  </footer>

  <dialog id="modal-seguro" class="modal">
    <form id="form-seguro" method="dialog" novalidate>
      <h2 id="modal-titulo">Novo seguro</h2>
      <label>Título<input name="titulo" maxlength="150" required></label>
      <label>Descrição<textarea name="descricao" rows="3" required></textarea></label>
      <div class="campo">
        <span>Imagem (emoji)</span>
        <div class="emojis" id="emojis"></div>
        <input name="imagem" maxlength="8" required aria-label="Emoji personalizado">
      </div>
      <div class="linha">
        <label>Categoria<input name="categoria" maxlength="50" list="lista-categorias" required></label>
        <label>Valor mensal (R$)<input name="valor_mensal" type="number" min="0" step="0.01" required></label>
      </div>
      <datalist id="lista-categorias"></datalist>
      <label>Cobertura em destaque<input name="cobertura_destaque" maxlength="250" required></label>
      <p class="erro-form" id="erro-form" role="alert"></p>
      <div class="acoes">
        <button class="botao" type="button" data-fechar>Cancelar</button>
        <button class="botao botao-primario" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="modal-excluir" class="modal modal-pequeno">
    <h2>Excluir seguro</h2>
    <p id="texto-excluir">Tem certeza?</p>
    <div class="acoes">
      <button class="botao" type="button" data-fechar>Cancelar</button>
      <button class="botao botao-perigo" type="button" id="confirmar-excluir">Excluir</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <script src="app.js"></script>
</body>
</html>
